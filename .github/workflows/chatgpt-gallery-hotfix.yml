name: ChatGPT gallery hotfix

on:
  push:
    paths:
      - .github/workflows/chatgpt-gallery-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply gallery fixes
        run: python3 .github/scripts/chatgpt_gallery_hotfix.py

      - name: Build check
        run: |
          npm ci
          npm run build

      - name: Commit fixes
        run: |
          if git diff --quiet -- src/main.js src/styles.css index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/styles.css index.html
          git commit -m "Fix gallery panels, text boards, and Q/E strafing"
          git push origin HEAD:main
